name = "ide-ws-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Route configuration
routes = [
  { pattern = "ide-ws.labcart.io", custom_domain = true }
]

# Durable Object bindings
[[durable_objects.bindings]]
name = "PROXY_ROUTER"
class_name = "ProxyRouter"

# Migrations for Durable Objects (using SQLite for free plan)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProxyRouter"]
